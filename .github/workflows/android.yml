name: Android app

# Builds the Ttip Android app in CI, so getting an installable APK needs no
# Android Studio and no local SDK — run the workflow, download the artifact.
#
#   Debug APK   — built on every run. Install it on a phone to test.
#   Release AAB — built only when the signing secrets below exist. This is the
#                 file uploaded to Google Play.
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   your .jks, base64-encoded:  base64 -w0 ttip.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the release job is skipped and the debug APK is still produced.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # AGP 8.7 needs JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # targetSdk 35 (Android 15) — see android/variables.gradle.
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      # Copies capacitor.config.ts + the offline fallback into android/.
      # The shell loads https://www.ttip.site, so there's no web build to bundle.
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: ttip-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- release, only when a keystore is configured ----
      # `secrets` is readable in a step `if`; a step's own `env` is not, so the
      # condition has to test the secret directly or the step never runs.
      - name: Decode keystore
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        if: steps.keystore.outputs.ready == 'true'
        working-directory: android
        env:
          TTIP_KEYSTORE: release.jks
          TTIP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TTIP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TTIP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.ready == 'true'
        with:
          name: ttip-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Never leave a signing key behind on the runner.
      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.jks
