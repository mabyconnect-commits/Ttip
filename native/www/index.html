<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ttip</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07080D; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; text-align: center; padding: 24px; }
      .logo { width: 72px; height: 72px; border-radius: 20px;
        background: linear-gradient(135deg,#6D5BFF,#2AC8FF 60%,#3DF5B0); }
      h1 { font-size: 20px; margin: 0; font-weight: 700; }
      p { color: rgba(255,255,255,.55); font-size: 14px; margin: 0; max-width: 260px; line-height: 1.5; }
      button { margin-top: 8px; background: #3DF5B0; color: #04121A; border: 0;
        height: 46px; padding: 0 22px; border-radius: 12px; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"></div>
      <h1>Can’t reach Ttip</h1>
      <p>Check your internet connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
